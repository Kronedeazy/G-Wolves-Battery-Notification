name: 🐞 Bug report
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! English or German is fine – I read every report.
  - type: input
    id: mouse
    attributes:
      label: Mouse model
      placeholder: e.g. HSK Pro V2
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options: [Receiver (wireless), Cable, Both]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Last lines of `%LOCALAPPDATA%\MouseBattery\log.txt`
      render: text
  - type: input
    id: version
    attributes:
      label: App version and Windows version
      placeholder: e.g. 1.0.0, Windows 11 24H2
