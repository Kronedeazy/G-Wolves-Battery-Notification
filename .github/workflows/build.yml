name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file exe
        run: dotnet publish MouseBattery.csproj -c Release -o publish --nologo

      - uses: actions/upload-artifact@v4
        with:
          name: MouseBattery
          path: publish/MouseBattery.exe

      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/MouseBattery.exe
          generate_release_notes: true
