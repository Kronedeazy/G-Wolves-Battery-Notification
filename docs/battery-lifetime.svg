<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
<style>.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e4e3df}.ref{stroke:#8a8984}.s1{stroke:#2a78d6}.s2{stroke:#eb6834}.f1{fill:#2a78d6}.f2{fill:#eb6834}.ring{stroke:#fcfcfb}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.grid{stroke:#33332f}.s1{stroke:#3987e5}.s2{stroke:#d95926}.f1{fill:#3987e5}.f2{fill:#d95926}.ring{stroke:#1a1a19}}</style>
<rect class="bg" width="880" height="440" rx="12"/>
<text class="t1" x="70" y="32" font-size="18" font-weight="600">Battery capacity left over the years (rough estimate)</text>
<line class="grid" x1="70" x2="640" y1="60" y2="60" stroke-width="1"/>
<text class="t2" x="60" y="64" font-size="12" text-anchor="end">100 %</text>
<line class="grid" x1="70" x2="640" y1="116" y2="116" stroke-width="1"/>
<text class="t2" x="60" y="120" font-size="12" text-anchor="end">90 %</text>
<line class="grid" x1="70" x2="640" y1="172" y2="172" stroke-width="1"/>
<text class="t2" x="60" y="176" font-size="12" text-anchor="end">80 %</text>
<line class="grid" x1="70" x2="640" y1="228" y2="228" stroke-width="1"/>
<text class="t2" x="60" y="232" font-size="12" text-anchor="end">70 %</text>
<line class="grid" x1="70" x2="640" y1="284" y2="284" stroke-width="1"/>
<text class="t2" x="60" y="288" font-size="12" text-anchor="end">60 %</text>
<line class="grid" x1="70" x2="640" y1="340" y2="340" stroke-width="1"/>
<text class="t2" x="60" y="344" font-size="12" text-anchor="end">50 %</text>
<text class="t2" x="70" y="360" font-size="12" text-anchor="middle">0</text>
<text class="t2" x="165" y="360" font-size="12" text-anchor="middle">1</text>
<text class="t2" x="260" y="360" font-size="12" text-anchor="middle">2</text>
<text class="t2" x="355" y="360" font-size="12" text-anchor="middle">3</text>
<text class="t2" x="450" y="360" font-size="12" text-anchor="middle">4</text>
<text class="t2" x="545" y="360" font-size="12" text-anchor="middle">5</text>
<text class="t2" x="640" y="360" font-size="12" text-anchor="middle">6</text>
<text class="t2" x="355" y="380" font-size="12" text-anchor="middle">Years of use</text>
<line class="ref" x1="70" x2="640" y1="172" y2="172" stroke-width="1.5" stroke-dasharray="5 4"/>
<text class="t2" x="78" y="188" font-size="12">Below 80 %: you notice shorter runtime</text>
<path class="s1" d="M70.0,60.0 L165.0,88.0 L260.0,116.0 L355.0,144.0 L450.0,172.0 L545.0,200.0 L640.0,228.0" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle class="f1 ring" cx="70.0" cy="60.0" r="4" stroke-width="2"/>
<circle class="f1 ring" cx="165.0" cy="88.0" r="4" stroke-width="2"/>
<circle class="f1 ring" cx="260.0" cy="116.0" r="4" stroke-width="2"/>
<circle class="f1 ring" cx="355.0" cy="144.0" r="4" stroke-width="2"/>
<circle class="f1 ring" cx="450.0" cy="172.0" r="4" stroke-width="2"/>
<circle class="f1 ring" cx="545.0" cy="200.0" r="4" stroke-width="2"/>
<circle class="f1 ring" cx="640.0" cy="228.0" r="4" stroke-width="2"/>
<text class="t1" x="654" y="224.0" font-size="13" font-weight="600">Charge to 100 %</text>
<text class="t2" x="654" y="241.0" font-size="12">after 6 years: ~70 %</text>
<path class="s2" d="M70.0,60.0 L165.0,73.2 L260.0,86.4 L355.0,99.5 L450.0,112.7 L545.0,125.9 L640.0,139.1" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle class="f2 ring" cx="70.0" cy="60.0" r="4" stroke-width="2"/>
<circle class="f2 ring" cx="165.0" cy="73.2" r="4" stroke-width="2"/>
<circle class="f2 ring" cx="260.0" cy="86.4" r="4" stroke-width="2"/>
<circle class="f2 ring" cx="355.0" cy="99.5" r="4" stroke-width="2"/>
<circle class="f2 ring" cx="450.0" cy="112.7" r="4" stroke-width="2"/>
<circle class="f2 ring" cx="545.0" cy="125.9" r="4" stroke-width="2"/>
<circle class="f2 ring" cx="640.0" cy="139.1" r="4" stroke-width="2"/>
<text class="t1" x="654" y="135.1" font-size="13" font-weight="600">Battery saver (25–80 %)</text>
<text class="t2" x="654" y="152.1" font-size="12">after 6 years: ~86 %</text>
<text class="t2" x="450" y="160" font-size="12" text-anchor="middle">~4 years</text>
<text class="t2" x="30" y="408" font-size="11">Assumes about 2 full charges a week (~100 cycles a year). Based on Battery University BU-808: ~300–500 cycles at full charge,</text>
<text class="t2" x="30" y="424" font-size="11">~850–1,500 cycles at a lower charge level. Real values depend on the cell, heat and how long it sits at 100 %.</text>
</svg>